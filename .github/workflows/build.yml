name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build published frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build-secure-frontend.mjs
          git diff --exit-code -- src/main/resources/static
      - name: Check published frontend credentials
        run: node scripts/check-frontend.mjs
      - name: Check Docker runtime configuration
        run: |
          grep -q '^USER app$' Dockerfile
          if grep -q '^ENV SPRING_PROFILES_ACTIVE=' Dockerfile; then
            echo 'Docker image must not force an environment-specific Spring profile'
            exit 1
          fi
      - name: Check project
        run: ./gradlew clean check spotlessCheck bootJar
