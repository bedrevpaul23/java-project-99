plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'io.sentry.jvm.gradle' version '6.19.0'
}

group = 'hexlet.code'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.11'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        googleJavaFormat('1.28.0')
    }
}

sentry {
    includeSourceContext = true
    authToken = System.getenv('SENTRY_AUTH_TOKEN')
    org = System.getenv('SENTRY_ORG')
    projectName = System.getenv('SENTRY_PROJECT')
}

def sentrySourceUploadCredentialsPresent =
        ['SENTRY_AUTH_TOKEN', 'SENTRY_ORG', 'SENTRY_PROJECT'].every { System.getenv(it) }

['sentryBundleSourcesJava', 'sentryUploadSourceBundleJava'].each { taskName ->
    tasks.named(taskName) {
        onlyIf { sentrySourceUploadCredentialsPresent }
    }
}
